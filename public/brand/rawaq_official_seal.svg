<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Circular Paths for Text -->
    <path id="topCurve" d="M 50 200 A 150 150 0 1 1 350 200" fill="none" />
    <path id="bottomCurve" d="M 350 200 A 150 150 0 1 1 50 200" fill="none" />
    <filter id="stampRoughness" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#stampRoughness)" stroke="#064e3b" fill="#064e3b" opacity="0.92">
    <!-- Outer Decorative Beaded Rings -->
    <circle cx="200" cy="200" r="190" fill="none" stroke="#064e3b" stroke-width="3" stroke-dasharray="6,4" />
    <circle cx="200" cy="200" r="182" fill="none" stroke="#064e3b" stroke-width="4.5" />
    <circle cx="200" cy="200" r="142" fill="none" stroke="#064e3b" stroke-width="2" />
    <circle cx="200" cy="200" r="136" fill="none" stroke="#064e3b" stroke-width="3" stroke-dasharray="4,3" />

    <!-- Top Text along curve -->
    <text font-family="'Cairo', 'Amiri', 'Segoe UI', Arial, sans-serif" font-size="16.5" font-weight="900" letter-spacing="2">
      <textPath href="#topCurve" startOffset="50%" text-anchor="middle" fill="#064e3b">
        ★ رَواق للتجارة الإلكترونية · الإدارة المالية ★
      </textPath>
    </text>

    <!-- Bottom Text along curve -->
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="800" letter-spacing="3.5">
      <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle" fill="#064e3b">
        RAWAQ FINANCIAL AUDIT &amp; CLEARING
      </textPath>
    </text>

    <!-- Inner Core Circle -->
    <circle cx="200" cy="200" r="105" fill="none" stroke="#064e3b" stroke-width="3.5" />
    <circle cx="200" cy="200" r="99" fill="none" stroke="#064e3b" stroke-width="1.5" />

    <!-- Inner Content -->
    <!-- Top Crown / Stars -->
    <g transform="translate(160, 116) scale(0.8)">
      <polygon points="10,25 25,5 40,25 50,45 0,45" fill="#064e3b" />
      <circle cx="25" cy="5" r="3.5" fill="#064e3b" />
      <circle cx="5" cy="25" r="2.5" fill="#064e3b" />
      <circle cx="45" cy="25" r="2.5" fill="#064e3b" />
      <polygon points="25,32 30,42 42,42 32,50 36,62 25,54 14,62 18,50 8,42 20,42" fill="#064e3b" transform="translate(25, -5) scale(0.6)" />
    </g>

    <!-- Main Center Brand Name in Traditional Style -->
    <text x="200" y="195" font-family="'Cairo', 'Amiri', 'Traditional Arabic', serif" font-size="38" font-weight="900" text-anchor="middle" letter-spacing="1">
      رَواق
    </text>

    <!-- Official Approval Badge Ribbon -->
    <rect x="120" y="210" width="160" height="26" rx="4" fill="#064e3b" />
    <text x="200" y="228" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="12.5" font-weight="900" fill="#ffffff" stroke="none" text-anchor="middle" letter-spacing="1">
      مُعتمـد ورسمـي
    </text>

    <!-- Location & Verified Tag -->
    <text x="200" y="258" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">
      المملكة الأردنية الهاشمية · عمّان
    </text>
    <text x="200" y="275" font-family="'Courier New', monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="2">
      VERIFIED &amp; CERTIFIED
    </text>
  </g>
</svg>
